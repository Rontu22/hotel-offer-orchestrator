# Local mirror of the production CloudFront routing: static bundle at the root,
# API paths proxied to the backend. Same-origin in both places, so no CORS.
server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets are immutable; the HTML entry point never is.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~ ^/(api|health)(/|$) {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
